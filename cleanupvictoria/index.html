<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign the Petition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="/petition.css" />
</head>
<body>

<main class="page">
  <section class="hero">
    <span class="eyebrow" data-bind="eyebrow"></span>
    <h1 data-bind="headline"></h1>
    <p class="lede" data-bind="lede"></p>
  </section>

  <aside class="petition-aside">
    <div class="petition">
      <div id="petition-form-wrap">
        <h2 data-bind="petH2"></h2>
        <p class="pet-lede" data-bind="petLede"></p>

        <form id="pet-form" novalidate>
          <div class="row-2">
            <div class="field">
              <label for="f-first">First Name<span class="req">*</span></label>
              <input id="f-first" name="first_name" autocomplete="given-name" placeholder="Jane" />
              <span class="err" id="e-first" style="display:none">Required</span>
            </div>
            <div class="field">
              <label for="f-last">Last Name<span class="req">*</span></label>
              <input id="f-last" name="last_name" autocomplete="family-name" placeholder="Citizen" />
              <span class="err" id="e-last" style="display:none">Required</span>
            </div>
          </div>

          <div class="field">
            <label for="f-email">Email<span class="req">*</span></label>
            <input id="f-email" name="email" type="email" autocomplete="email" placeholder="jane@example.com.au" />
            <span class="err" id="e-email" style="display:none">Valid email required</span>
          </div>

          <div class="field">
            <label for="f-phone">Phone</label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="04XX XXX XXX" />
          </div>

          <div class="field">
            <label for="f-postcode">Postcode</label>
            <input id="f-postcode" name="postcode" inputmode="numeric" maxlength="4" autocomplete="postal-code" />
          </div>

          <button class="sign-btn" type="submit" id="f-submit" data-bind="petSubmit"></button>
          <div class="counter">
            <b id="form-counter">0</b> Victorians have already signed
          </div>
          <div class="fail-msg" id="fail-msg" style="display:none">
            We couldn't submit your signature. Please check your connection and try again.
          </div>
        </form>
      </div>

      <div id="petition-thanks" style="display:none">
        <div class="thanks">
          <div class="thanks-tick">✓</div>
          <h3 id="thanks-name" data-bind="petSuccessHeading"></h3>
          <p data-bind="petSuccessBody"></p>
          <div class="share-prompt">Share this petition</div>
          <div class="share-grid">
            <button type="button" class="share-btn share-btn--fb" id="share-fb" aria-label="Share on Facebook">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 10-11.6 9.9V14.9H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7c4.8-.8 8.5-5 8.5-9.9z"/></svg>
              <span>Facebook</span>
            </button>
            <button type="button" class="share-btn share-btn--x" id="share-x" aria-label="Post on X">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 3H22l-7.4 8.5L23.3 21H16.5l-5.3-7-6.1 7H1.9L9.8 12 1.5 3h6.9l4.8 6.4L18.9 3zm-1.1 16h1.7L7.3 4.8H5.4L17.8 19z"/></svg>
              <span>X</span>
            </button>
            <button type="button" class="share-btn share-btn--ig" id="share-ig" aria-label="Share on Instagram">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.9" fill="currentColor"/></svg>
              <span>Instagram</span>
            </button>
            <button type="button" class="share-btn share-btn--wa" id="share-wa" aria-label="Share on WhatsApp">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.4-.2-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.4-1.4-.9-.8-1.5-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.2.3-.4.1-.2 0-.3-.1-.5-.1-.2-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.4-.2.3-.9.9-.9 2.2 0 1.3.9 2.5 1 2.7.1.2 1.8 2.7 4.3 3.8 2.5 1 2.5.7 2.9.6.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.3.1-1.4-.1-.1-.3-.2-.5-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.1-1.3c1.5.8 3.1 1.3 4.9 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
              <span>WhatsApp</span>
            </button>
            <button type="button" class="share-btn share-btn--sms" id="share-sms" aria-label="Share by text message">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 5.8 2 10.5c0 2.3 1.1 4.4 2.9 5.9-.1 1.2-.5 2.5-1.4 3.6-.2.2-.2.5-.1.7.1.2.4.3.6.3 2.2-.2 3.9-1 5-1.9 1 .3 2 .4 3 .4 5.5 0 10-3.8 10-8.5S17.5 2 12 2zM7.5 11.5a1 1 0 110-2 1 1 0 010 2zm4.5 0a1 1 0 110-2 1 1 0 010 2zm4.5 0a1 1 0 110-2 1 1 0 010 2z"/></svg>
              <span>Text</span>
            </button>
            <button type="button" class="share-btn share-btn--em" id="share-email" aria-label="Share by email">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <span>Email</span>
            </button>
            <button type="button" class="share-btn share-btn--cp" id="copy-btn" aria-label="Copy link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 10a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg>
              <span>Copy Link</span>
            </button>
          </div>
          <div class="share-toast" id="share-toast"></div>
        </div>
      </div>
    </div>
  </aside>

  <div class="content">
    <div class="hero-photo" aria-label="Photo placeholder">
      <span class="photo-tag" data-bind="photoCaption"></span>
    </div>

    <div class="stats" data-bind="stats"></div>

    <section class="argument">
      <div class="section-label" data-bind="argSectionLabel"></div>
      <h2 data-bind="argH2"></h2>
      <p class="lede" data-bind="argLede"></p>
      <p data-bind="argBody"></p>

      <div class="quotebox">
        <span data-bind="argQuote"></span>
        <cite data-bind="argQuoteCite"></cite>
      </div>

      <h3 data-bind="argPlanHeading"></h3>
      <ul class="points" data-bind="argPlan"></ul>

      <h3 data-bind="argWhyHeading"></h3>
      <p data-bind="argWhyBody"></p>

      <div class="sources">
        <h4>Sources</h4>
        <ol data-bind="sources"></ol>
      </div>
    </section>
  </div>
</main>

<footer class="vec" data-bind="vec"></footer>

<script>window.PETITION_SLUG = 'cleanupvictoria';</script>
<script src="/petition.js"></script>
</body>
</html>
